<!doctype html><meta charset="utf-8"><title>Researcher session viewer</title><style>body{font:16px Arial;color:#353535;margin:0}header{background:#142f52;color:white;padding:20px}main{padding:24px}img{width:20%;object-fit:contain}section{border-bottom:1px solid #ccc;padding:12px}pre{white-space:pre-wrap}</style><header>Co-Ideation · Researcher</header><main><input type="file" id="file" accept=".json"><div id="out"></div></main><script>const out=document.getElementById('out');function text(parent,tag,value){const e=document.createElement(tag);e.textContent=value;parent.append(e)}document.getElementById('file').onchange=async e=>{try{const s=JSON.parse(await e.target.files[0].text());out.innerHTML='';text(out,'h2',s.participant+' · '+s.assignment);text(out,'pre',JSON.stringify(s.pretest,null,2));for(const c of s.conditions){const section=document.createElement('section');out.append(section);text(section,'h2',c.task+' · '+c.id+' · '+c.fidelity+' · '+(c.diversity||'legacy quantity condition')+' · '+c.quantity);for(const it of c.iterations){text(section,'h3','Iteration '+it.number);for(const src of [it.input,...it.outputs]){if(!src.startsWith('data:image/'))continue;const im=document.createElement('img');im.src=src;section.append(im)}text(section,'p',it.prompt);text(section,'pre',JSON.stringify(it.markers,null,2))}text(section,'pre',JSON.stringify({answers:c.answers,comparison:c.comparison},null,2))}text(out,'p','Recorded events: '+s.events.length)}catch(err){out.textContent=err.message}};</script>
